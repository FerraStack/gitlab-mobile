name: Update README screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Record and convert README screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Install WebP converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webp
      - name: Record README screenshots with Roborazzi
        run: >-
          ./gradlew :app:testDebugUnitTest --tests "com.cboyxd.gitlab.ReadmeScreenshotTest"
          -Proborazzi.test.record=true --rerun --console=plain
      - name: Convert screenshots to WebP
        run: python3 tools/update_readme_screenshots.py
      - name: Upload docs/screenshots artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-screenshots-${{ github.run_id }}
          path: docs/screenshots/
          if-no-files-found: error
          retention-days: 14
